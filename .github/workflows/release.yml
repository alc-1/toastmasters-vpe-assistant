name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Bump package.json version
        run: npm version ${{ inputs.bump }} --no-git-tag-version

      - name: Read new version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Sync manifest versions
        run: |
          sed -i -E 's/"version": "[^"]+"/"version": "${{ steps.version.outputs.version }}"/' manifest.preview.json manifest.store.json

      - name: Build (store)
        run: npm run build

      - name: Build (preview)
        run: npm run build:preview

      - name: Zip dist/
        id: zip
        run: |
          PREVIEW_ZIP="toastmasters-vpe-assistant-preview-v${{ steps.version.outputs.version }}.zip"
          STORE_ZIP="toastmasters-vpe-assistant-store-v${{ steps.version.outputs.version }}-candidate.zip"

          cd dist/preview
          zip -r "../../$PREVIEW_ZIP" .
          cd ../..

          cd dist/store
          zip -r "../../$STORE_ZIP" .
          cd ../..

          echo "preview_zip_name=$PREVIEW_ZIP" >> "$GITHUB_OUTPUT"
          echo "store_zip_name=$STORE_ZIP" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json manifest.preview.json manifest.store.json
          git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Tag release
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: |
            ${{ steps.zip.outputs.preview_zip_name }}
            ${{ steps.zip.outputs.store_zip_name }}
          generate_release_notes: true
          body: |
            ## Two downloads, two purposes
            - 🧪 **${{ steps.zip.outputs.preview_zip_name }}** — for testers. Install this one. Follow the steps below.
            - 🏪 **${{ steps.zip.outputs.store_zip_name }}** — the Chrome Web Store submission candidate. Not meant for general install; ignore this one unless you know why you're here.

            ## Before you start
            - ✅ You need a **computer** (Windows or Mac) — this won't work on a phone or tablet.
            - ✅ You need **Google Chrome**, **Microsoft Edge**, **Brave**, **Opera**, **Vivaldi**, or **Arc** as your browser.
            - ✅ You need to be an **officer of a Toastmasters club** in Basecamp and/or EasySpeak — the extension only shows data for clubs where you hold an officer role.

            > This extension isn't on the Chrome Web Store yet, so installing it takes a few extra manual steps below. Don't worry — it only takes 2 minutes, just follow along carefully.

            ## Installation (step by step)

            ### Step 1 — Download the file
            Click on **${{ steps.zip.outputs.preview_zip_name }}** under "Assets" at the bottom of this page (you may need to click "Assets" to expand the list first). It will download to your computer, usually into your **Downloads** folder.

            ### Step 2 — Unzip the file
            Find the downloaded file (probably in your **Downloads** folder) and double-click it to unzip it.
            - **On Windows:** right-click the file → "Extract All" → click "Extract".
            - **On Mac:** just double-click it — it will unzip automatically.

            You should now see a **folder** (not a .zip file) with the same name.

            ### Step 3 — Open the Extensions page
            Copy this address: `chrome://extensions`

            Paste it into your browser's address bar (the same place you type website addresses) and press Enter.

            > ⚠️ This link won't work if you click it directly from this page — that's a Chrome security restriction. You have to copy-paste it yourself.

            ### Step 4 — Turn on Developer mode
            In the top-right corner of the page that just opened, find the **Developer mode** toggle switch and turn it **on**.

            ### Step 5 — Load the extension
            Three new buttons will appear. Click **Load unpacked**, then select the **folder** you unzipped in Step 2 (not the .zip file).

            ✅ **Done!** You should now see the extension's icon appear in your browser toolbar.

            ---
            **Something not working?** [Open an issue here](../../issues) and describe what you see — happy to help.
