name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      chrome_store_zip: ${{ steps.zip.outputs.chrome_store_zip }}
      firefox_store_zip: ${{ steps.zip.outputs.firefox_store_zip }}
      firefox_store_sources_zip: ${{ steps.zip.outputs.firefox_store_sources_zip }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Bump package.json version
        run: npm version ${{ inputs.bump }} --no-git-tag-version

      - name: Read new version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Zip all 4 build combinations
        id: zip
        run: |
          # wxt.config.ts reads the extension version from package.json directly
          # (no separate manifest files to keep in sync anymore). Each `wxt zip`
          # call both builds and zips; Firefox also produces a companion
          # "-sources-<mode>.zip" (AMO's review requirement for a bundled build) —
          # 6 zip files total.
          npx wxt zip --mode store
          npx wxt zip -b firefox --mode store
          npx wxt zip --mode preview
          npx wxt zip -b firefox --mode preview

          V="${{ steps.version.outputs.version }}"
          echo "chrome_store_zip=toastmasters-vpe-assistant-$V-chrome-store.zip" >> "$GITHUB_OUTPUT"
          echo "firefox_store_zip=toastmasters-vpe-assistant-$V-firefox-store.zip" >> "$GITHUB_OUTPUT"
          echo "firefox_store_sources_zip=toastmasters-vpe-assistant-$V-sources-store.zip" >> "$GITHUB_OUTPUT"
          echo "chrome_preview_zip=toastmasters-vpe-assistant-$V-chrome-preview.zip" >> "$GITHUB_OUTPUT"
          echo "firefox_preview_zip=toastmasters-vpe-assistant-$V-firefox-preview.zip" >> "$GITHUB_OUTPUT"
          echo "firefox_preview_sources_zip=toastmasters-vpe-assistant-$V-sources-preview.zip" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Tag release
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: |
            .output/${{ steps.zip.outputs.chrome_preview_zip }}
            .output/${{ steps.zip.outputs.chrome_store_zip }}
            .output/${{ steps.zip.outputs.firefox_preview_zip }}
            .output/${{ steps.zip.outputs.firefox_preview_sources_zip }}
            .output/${{ steps.zip.outputs.firefox_store_zip }}
            .output/${{ steps.zip.outputs.firefox_store_sources_zip }}
          generate_release_notes: true
          body: |
            ## Downloads

            - 🧪 **${{ steps.zip.outputs.chrome_preview_zip }}** — Chrome/Edge/Brave/etc. testers. Install this one.
            - 🧪 **${{ steps.zip.outputs.firefox_preview_zip }}** — Firefox testers. Install this one (see the Firefox section below — it's a different process than Chrome's).
            - 🏪 **${{ steps.zip.outputs.chrome_store_zip }}** — the store submission build. Not meant for general install; ignore this one unless you know why you're here.
            - 🏪 **${{ steps.zip.outputs.firefox_store_zip }}** / **${{ steps.zip.outputs.firefox_store_sources_zip }}** — the AMO (addons.mozilla.org) submission candidate + its required sources archive. Not meant for general install.
            - The **-sources-preview.zip** file is the sources archive for the Firefox *preview* build; ignore it unless you're the maintainer verifying an AMO submission.

            ## Chrome / Edge / Brave / Opera / Vivaldi / Arc

            ### Step 1 — Download the file
            Click on **${{ steps.zip.outputs.chrome_preview_zip }}** under "Assets" at the bottom of this page (you may need to click "Assets" to expand the list first). It will download to your computer, usually into your **Downloads** folder.

            ### Step 2 — Unzip the file
            Find the downloaded file (probably in your **Downloads** folder) and double-click it to unzip it.
            - **On Windows:** right-click the file → "Extract All" → click "Extract".
            - **On Mac:** just double-click it — it will unzip automatically.

            You should now see a **folder** (not a .zip file) with the same name.

            ### Step 3 — Open the Extensions page
            Copy this address: `chrome://extensions`

            Paste it into your browser's address bar (the same place you type website addresses) and press Enter.

            > ⚠️ This link won't work if you click it directly from this page — that's a Chrome security restriction. You have to copy-paste it yourself.

            ### Step 4 — Turn on Developer mode
            In the top-right corner of the page that just opened, find the **Developer mode** toggle switch and turn it **on**.

            ### Step 5 — Load the extension
            Three new buttons will appear. Click **Load unpacked**, then select the **folder** you unzipped in Step 2 (not the .zip file).

            ✅ **Done!** You should now see the extension's icon appear in your browser toolbar.

            ## Firefox

            Firefox does not support permanently loading an unpacked/unsigned extension the way Chrome's "Load unpacked" does — every install (even a self-distributed one) needs Mozilla's signature, which this preview build doesn't have yet. Until this extension is submitted to addons.mozilla.org:

            1. Download **${{ steps.zip.outputs.firefox_preview_zip }}** and unzip it (same steps as Chrome above).
            2. Go to `about:debugging#/runtime/this-firefox` in Firefox.
            3. Click **Load Temporary Add-on…** and select the **manifest.json** file inside the unzipped folder.
            4. ✅ The extension is now active — but only for this browser session. Firefox removes temporary add-ons on restart, so you'll need to repeat these steps after quitting/reopening Firefox.

            ---
            **Something not working?** [Open an issue here](../../issues) and describe what you see — happy to help.

      - name: Upload Chrome Web Store build
        uses: actions/upload-artifact@v4
        with:
          name: store-build
          path: .output/${{ steps.zip.outputs.chrome_store_zip }}

      - name: Upload Firefox Add-on store build
        uses: actions/upload-artifact@v4
        with:
          name: firefox-store-build
          path: |
            .output/${{ steps.zip.outputs.firefox_store_zip }}
            .output/${{ steps.zip.outputs.firefox_store_sources_zip }}

  publish-store:
    needs: release
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: read
    concurrency:
      group: chrome-web-store-publish
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download Chrome Web Store build
        uses: actions/download-artifact@v4
        with:
          name: store-build
          path: .output

      - name: Submit to Chrome Web Store
        env:
          # v1.1 (client ID/secret/refresh token) is deprecated and shuts down
          # October 15th, 2026 — v2 (service account) is what publish-browser-extension
          # itself recommends, so that's what this pipeline uses.
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: npx wxt submit --chrome-zip .output/${{ needs.release.outputs.chrome_store_zip }}

  publish-firefox-store:
    needs: release
    runs-on: ubuntu-latest
    environment: firefox-addon-store
    permissions:
      contents: read
    concurrency:
      group: firefox-addon-store-publish
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download Firefox Add-on store build
        uses: actions/download-artifact@v4
        with:
          name: firefox-store-build
          path: .output

      - name: Submit to Firefox Add-on Store
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          npx wxt submit \
            --firefox-zip .output/${{ needs.release.outputs.firefox_store_zip }} \
            --firefox-sources-zip .output/${{ needs.release.outputs.firefox_store_sources_zip }} \
            --firefox-extension-id "$FIREFOX_EXTENSION_ID"

  publish-edge-store:
    needs: release
    runs-on: ubuntu-latest
    environment: edge-addon-store
    permissions:
      contents: read
    concurrency:
      group: edge-addon-store-publish
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download Chrome Web Store build
        uses: actions/download-artifact@v4
        with:
          name: store-build
          path: .output

      - name: Submit to Edge Add-ons Store
        id: submit
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: npx wxt submit --edge-zip .output/${{ needs.release.outputs.chrome_store_zip }}

      - name: Note on failure
        if: failure() && steps.submit.outcome == 'failure'
        run: |
          echo "::error::Submitting to the Edge Add-ons Store failed. If the error above is an auth/401 error, EDGE_API_KEY likely expired — Microsoft's Edge Add-ons API keys have a fixed expiry. Generate a new one at https://partner.microsoft.com/en-us/dashboard/microsoftedge/overview and update the EDGE_API_KEY secret in the edge-addon-store environment."
