name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["landing/**", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["landing/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Lint CSS
        run: npm run lint:css

      - name: Build (store, Chrome)
        run: npm run build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Browser binaries are what actions/cache saves above; the OS-level
      # shared libraries `--with-deps` also installs are apt packages, which
      # aren't part of that cached path and don't persist between runs on a
      # fresh GitHub-hosted runner — so a cache hit still needs
      # install-deps, just without re-downloading Chromium itself.
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

      - name: Build (store, Firefox)
        run: npm run build:firefox

      - name: Verify store builds have no update-checker references
        run: |
          if grep -r "api.github.com" .output/store/; then
            echo "::error::Store builds must not reference the GitHub releases API"
            exit 1
          fi

      - name: Build (preview, Chrome)
        run: npm run build:preview

      - name: Build (preview, Firefox)
        run: npm run build:preview:firefox
