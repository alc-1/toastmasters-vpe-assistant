name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["landing/**", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["landing/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build (store)
        run: npm run build

      - name: Verify store build has no update-checker references
        run: |
          if grep -r "api.github.com" dist/store/; then
            echo "::error::Store build must not reference the GitHub releases API"
            exit 1
          fi

      - name: Build (preview)
        run: npm run build:preview
