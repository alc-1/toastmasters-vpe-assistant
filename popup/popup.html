<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Toastmasters VPE Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 360px;
      padding: 12px;
      color: #222;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 10px;
    }
    button {
      width: 100%;
      padding: 8px;
      font-size: 13px;
      cursor: pointer;
      background: #772432;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #555;
      white-space: pre-wrap;
    }
    #summary {
      margin-top: 10px;
      font-size: 12px;
    }
    #summary table {
      width: 100%;
      border-collapse: collapse;
    }
    #summary td, #summary th {
      text-align: left;
      padding: 2px 4px;
      border-bottom: 1px solid #eee;
    }
    details {
      margin-top: 10px;
    }
    pre {
      max-height: 220px;
      overflow: auto;
      background: #f5f5f5;
      padding: 6px;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <h1>Toastmasters VPE Tracker — Basecamp MVP</h1>
  <button id="scrapeBtn">Extract Basecamp data</button>
  <div id="status">Open a tab on Basecamp Toastmasters (logged in), then click the button.</div>
  <div id="summary"></div>
  <details>
    <summary>Raw data (JSON)</summary>
    <pre id="rawData"></pre>
  </details>
  <script src="popup.js"></script>
</body>
</html>
