<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="welcome.meta.title.label"></title>
  <link rel="icon" type="image/png" href="/icons/default/32.png">
  <link rel="stylesheet" href="../../shared/styles.css">
</head>
<body class="page--narrow">
  <header class="app-header">
    <div class="app-header__brand">
      <img class="app-header__logo" src="/icons/default/48.png" width="48" height="48" alt="" />
      <div class="app-header__text">
        <div class="app-header__title" data-i18n="common.brand.title.label"></div>
        <div class="app-header__subtitle" data-i18n="common.tagline.default.body"></div>
      </div>
    </div>
  </header>

  <div class="welcome-card">
    <h1 data-i18n="welcome.card.heading.title"></h1>
    <p class="welcome-intro" data-i18n="welcome.card.intro.body"></p>

    <div class="pin-guide">
      <div class="pin-guide__mockup" id="pinMockup"></div>
      <ol class="pin-guide__steps">
        <li data-i18n="welcome.pinGuide.step1.label"></li>
        <li data-i18n="welcome.pinGuide.step2.label"></li>
        <li data-i18n="welcome.pinGuide.step3.label"></li>
      </ol>
    </div>

    <div class="welcome-actions">
      <button id="getStartedBtn" class="btn btn-primary" data-i18n="welcome.action.getStarted.button"></button>
    </div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
