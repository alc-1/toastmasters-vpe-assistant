<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Toastmasters VPE Assistant — Club Review</title>
  <link rel="icon" type="image/png" href="/icons/default/32.png">
  <link rel="stylesheet" href="../../shared/styles.css">
  <style>
    body {
      max-width: 800px;
    }
    .save-status {
      font-size: var(--text-sm);
      color: var(--success);
      display: none;
    }
    .save-status.visible {
      display: inline;
    }
    .actions button {
      margin-right: 4px;
    }
  </style>
</head>
<body class="page--wide">
  <div id="appShell"></div>
  <h1 class="page-title">Club Review</h1>

  <div class="card">
    <div class="card-header"><span class="card-header__title">Club name lookup</span></div>
    <div class="card-body">
      <p class="help-text">
        Pins a Basecamp club to an EasySpeak club regardless of how similar their names are.
        Suggested matches based on name similarity can be confirmed or rejected below.
      </p>
      <div id="clubLookupRoot"></div>
    </div>
  </div>

  <div id="stepFooter"></div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
