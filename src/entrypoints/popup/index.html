<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Deliberately no <title> here: WXT reads a popup entrypoint's <title>
       tag as the manifest's action.default_title (the toolbar tooltip),
       overriding wxt.config.ts's manifest.action.default_title — which
       needs to vary by build mode (the "(Preview)" suffix). wxt.config.ts
       stays the single source of truth for that string instead. -->
  <link rel="icon" type="image/png" href="/icons/default/32.png">
  <link rel="stylesheet" href="../../shared/styles.css">
  <style>
    .app-header__title {
      font-size: var(--text-md);
    }
    #popupStepperRoot .app-stepper--vertical {
      margin-bottom: 0;
    }
    /* Reserves the vertical stepper's footprint before computeStepperInfo()
       (an inherently async browser.storage read — main.ts's init()) resolves
       and fills this root. Without this, the popup opens as header-only and
       then grows once, in one jump, the moment the stepper renders — even
       batched into a single DOM write, that's still a real post-first-paint
       content-size change for Chromium's native popup auto-resize to react
       to. Reserving the space up front means the popup opens already at
       (approximately) its final size, leaving nothing for the auto-resize
       to visibly react to. 318px is the measured height of the current
       fixed 5-item NAV_ITEMS list (shared/app-shell.ts) with typical info
       text; re-measure if a step is added/removed. */
    #popupStepperRoot {
      min-height: 360px;
    }
    /* shared/styles.css only clamps the subtitle inside an
       @media (max-width: 1024px) block, meant for a real narrow browser
       window — this unconditional override keeps the popup's own clamping
       independent of that media query (see the min-width history above:
       measurement-pass/final-layout viewport differences were a real,
       measured source of resize instability here). 2 lines, not 1: at
       min-width: 400px the full sentence still doesn't always fit on one
       line, and clamping to 1 was truncating it. */
    .page--popup .app-header__subtitle {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .popup-footer {
      display: flex;
      justify-content: center;
      padding: var(--space-3) 0 var(--space-2);
    }
    .popup-footer__link {
      font-size: var(--text-sm);
      color: var(--gray-600);
      text-decoration: none;
    }
    .popup-footer__link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body class="page--popup">
  <header class="app-header">
    <div class="app-header__brand">
      <img class="app-header__logo" src="/icons/default/48.png" width="48" height="48" alt="" />
      <div class="app-header__text">
        <div class="app-header__title">Toastmasters VPE Assistant</div>
        <div class="app-header__subtitle">One place to understand your club’s member progress.</div>
      </div>
    </div>
    <button id="popupSettingsBtn" type="button" class="app-header__settings-btn" title="Global Settings" aria-label="Global Settings"></button>
  </header>

  <div id="updateBannerRoot"></div>
  <div id="selfUpdateBannerRoot"></div>
  <div id="popupStepperRoot"></div>

  <div class="popup-footer">
    <a href="#" id="popupWhatsNewLink" class="popup-footer__link">What's New</a>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
