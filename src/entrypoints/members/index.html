<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Toastmasters VPE Assistant — Member Review</title>
  <link rel="icon" type="image/png" href="/icons/default/32.png">
  <link rel="stylesheet" href="../../shared/styles.css">
  <style>
    body {
      max-width: 1100px;
    }
    table.members {
      margin-bottom: 20px;
    }
    table.members tr.detail-row {
      background: var(--surface-alt);
    }
    table.members tr.detail-row td {
      border-left: 3px solid var(--tm-silver);
    }
    .actions {
      white-space: nowrap;
    }
    .actions button {
      margin-right: 4px;
    }
    input.link-search {
      font-size: var(--text-sm);
      padding: 3px 6px;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .path-pair-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 6px 0;
      font-size: var(--text-sm);
    }
    /* input.link-search's width: 100% is correct in its usual table-cell
       context (the input is the cell's only content) but would otherwise
       blow out this flex row, squeezing every sibling button — constrain it
       to a fixed-ish share of the row instead. */
    .path-pair-row input.link-search {
      width: auto;
      flex: 1 1 220px;
      min-width: 160px;
    }
  </style>
</head>
<body class="page--wide">
  <div id="appShell"></div>
  <h1 class="page-title">Member Review</h1>
  <div class="meta" id="pageMeta"></div>

  <div id="conflictWarning" aria-live="polite"></div>
  <div id="clubTabs" class="tabs"></div>
  <div id="filterChips" class="toolbar"></div>
  <input type="text" id="memberSearch" class="search-input" placeholder="Search by member or path name…">
  <div id="membersRoot"></div>

  <div id="stepFooter"></div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
