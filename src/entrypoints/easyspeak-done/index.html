<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Toastmasters VPE Assistant — EasySpeak data fetched</title>
  <link rel="icon" type="image/png" href="/icons/default/32.png">
  <link rel="stylesheet" href="../../shared/styles.css">
  <style>
    .icon {
      margin-bottom: 12px;
    }
    h1 {
      font-size: var(--text-lg);
      margin: 0 0 12px;
      color: var(--success);
    }
    p {
      font-size: var(--text-base);
      color: var(--gray-600);
      line-height: 1.5;
    }
    .note {
      font-size: var(--text-sm);
      color: var(--gray-600);
      margin-top: 24px;
    }
    button {
      margin-top: 10px;
    }
  </style>
</head>
<body class="page--status">
  <div class="confirmation-card">
    <div class="icon"><img src="/icons/success/48.png" width="48" height="48" alt=""></div>
    <h1>EasySpeak data fetched</h1>
    <p>
      All club data has been extracted and saved. Open the extension popup to
      see the results.
    </p>
    <p class="note" id="countdownText" aria-live="polite">This tab will close automatically in <span id="countdown">5</span> seconds.</p>
    <button id="cancelBtn" class="btn btn-secondary">Keep this tab open</button>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
