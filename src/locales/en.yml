# src/locales/en.yml
#
# The extension's single message source of truth (English-only for now — a second
# language is a new src/locales/<lang>.yml file plus a small locale-selection
# mechanism, not a rearchitecture). @wxt-dev/i18n requires exactly one file per
# locale, so this one file is organized as top-level sections mirroring the
# scope.element.specificity.type key convention documented in CLAUDE.md's
# "Internationalization (i18n)" section — read that section before adding keys
# here, especially the note on the two call paths (`i18n.t()` via the WXT-auto-
# imported #i18n vs. the small local shim in shared/i18n-pure.ts) and the
# pluralization format (numeric `1`/`n` keys, joined by @wxt-dev/i18n into a
# " | "-separated string — not an {one, other} shape).

