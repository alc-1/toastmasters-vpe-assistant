# src/locales/fr.yml
#
# French translation of src/locales/en.yml — same key structure, same
# scope.element.specificity.type convention (see CLAUDE.md's "Internationalization
# (i18n)" section). @wxt-dev/i18n scans every src/locales/*.yml file automatically
# and generates _locales/fr/messages.json alongside _locales/en/'s at build time.
#
# Locale selection is entirely automatic, native WebExtension i18n behavior —
# browser.i18n.getMessage() (which the ambient i18n.t() wraps) serves whichever
# _locales/<lang>/ best matches the browser's own UI language, falling back to
# manifest.default_locale ("en") otherwise. No in-app switcher exists or is needed
# for a user whose browser itself is set to French. shared/i18n-pure.ts (the
# separate, browser-free t() used by the handful of Vitest-tested pure modules —
# see CLAUDE.md's "Two call paths" section) mirrors this via its own
# browser.i18n.getUILanguage() check, so both i18n paths resolve to the same
# locale.
#
# Product/brand names are left untranslated: "Toastmasters VPE Assistant" (proper
# name), "Basecamp"/"EasySpeak"/"Club Central" (the three data sources), "Pathways"
# (the Toastmasters education program name), "VPE" (used as-is in French
# Toastmasters materials for "Vice-président(e) Éducation").

