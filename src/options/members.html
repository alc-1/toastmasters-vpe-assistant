<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Toastmasters VPE Assistant — Member Review</title>
  <link rel="icon" type="image/png" href="../icons/icon-32.png">
  <link rel="stylesheet" href="../shared/styles.css">
  <style>
    body {
      max-width: 1100px;
    }
    h1 {
      font-size: var(--text-xl);
      margin: 0 0 4px;
    }
    .club-summary {
      font-size: var(--text-sm);
      color: var(--gray-600);
      margin-bottom: 10px;
    }
    table.members {
      margin-bottom: 20px;
    }
    table.members tr.detail-row {
      background: var(--surface-alt);
    }
    table.members tr.detail-row td {
      border-left: 3px solid var(--tm-silver);
    }
    table.members tr.detail-row.collapsed {
      display: none;
    }
    .muted-text {
      color: var(--gray-600);
    }
    .actions {
      white-space: nowrap;
    }
    .actions button {
      font-size: var(--text-xs);
      padding: 4px 8px;
      margin-right: 4px;
      cursor: pointer;
      background: var(--tm-burgundy);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
    }
    .actions button.secondary {
      background: var(--surface-alt);
      color: var(--gray-700);
      border: 1px solid var(--border);
    }
    .actions button:disabled {
      background: var(--disabled-bg);
      cursor: not-allowed;
    }
    input.link-search {
      font-size: var(--text-sm);
      padding: 3px 6px;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .path-pair-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 6px 0;
      font-size: var(--text-sm);
    }
    .path-pair-row select {
      font-size: var(--text-sm);
      padding: 2px;
    }
  </style>
</head>
<body class="page--wide">
  <div id="appShell"></div>
  <h1>Member Review</h1>
  <div class="meta" id="pageMeta"></div>

  <div id="conflictWarning" aria-live="polite"></div>
  <div id="clubTabs" class="tabs"></div>
  <div id="filterChips" class="toolbar"></div>
  <p class="help-text">
    "To do" combines Suggested, Unmatched, and Path issues below. A Suggested match is a computer
    guess awaiting your Confirm/Reject — until confirmed, it won't show as matched on the
    Club Progress page.
  </p>
  <div id="membersRoot"></div>

  <script type="module" src="./members.ts"></script>
</body>
</html>
