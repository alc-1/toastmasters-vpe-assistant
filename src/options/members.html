<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Toastmasters VPE Tracker — Member Matching</title>
  <link rel="icon" type="image/png" href="../icons/icon-32.png">
  <link rel="stylesheet" href="../shared/styles.css">
  <style>
    body {
      max-width: 1100px;
    }
    h1 {
      font-size: var(--text-xl);
      margin: 0 0 4px;
    }
    .chip {
      padding: 5px 12px;
      font-size: var(--text-sm);
      cursor: pointer;
      background: var(--gray-200);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-pill);
      color: var(--gray-700);
    }
    .chip:hover {
      background: #e6e6e6;
    }
    .chip.active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: white;
    }
    .chip.active .chip-count {
      color: var(--color-primary);
      background: white;
    }
    .filter-chips {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .club-summary {
      font-size: var(--text-sm);
      color: var(--gray-600);
      margin-bottom: 10px;
    }
    table.members {
      margin-bottom: 20px;
    }
    table.members tr.detail-row {
      background: var(--gray-100);
    }
    table.members tr.detail-row.collapsed {
      display: none;
    }
    .muted-text {
      color: var(--gray-600);
    }
    .actions {
      white-space: nowrap;
    }
    .actions button {
      font-size: var(--text-xs);
      padding: 4px 8px;
      margin-right: 4px;
      cursor: pointer;
      background: var(--color-primary);
      color: white;
      border: none;
      border-radius: var(--radius-md);
    }
    .actions button.secondary {
      background: var(--gray-100);
      color: var(--gray-700);
    }
    .actions button:disabled {
      background: var(--color-disabled-bg);
      cursor: not-allowed;
    }
    input.link-search {
      font-size: var(--text-sm);
      padding: 3px 6px;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--gray-300);
      border-radius: var(--radius-sm);
    }
    .path-pair-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 6px 0;
      font-size: var(--text-sm);
    }
    .path-pair-row select {
      font-size: var(--text-sm);
      padding: 2px;
    }
  </style>
</head>
<body class="page--wide">
  <h1>Member Matching</h1>
  <div class="meta" id="pageMeta"></div>
  <nav class="page-nav" aria-label="Related pages">
    <a href="report.html">Comparison report</a> · <a href="settings.html">Settings (lookups)</a>
  </nav>

  <div id="conflictWarning" aria-live="polite"></div>
  <div id="clubTabs" class="tabs"></div>
  <div id="filterChips" class="filter-chips"></div>
  <p class="help-text">
    "To do" combines Suggested, Unmatched, and Path issues below. A Suggested match is a computer
    guess awaiting your Confirm/Reject — until confirmed, it won't show as matched on the
    Comparison Report.
  </p>
  <div id="membersRoot"></div>

  <script type="module" src="./members.ts"></script>
</body>
</html>
