<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Toastmasters VPE Tracker — Comparison Report</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 20px 60px;
      color: #222;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 4px;
    }
    .meta {
      font-size: 12px;
      color: #666;
      margin-bottom: 20px;
    }
    h2 {
      font-size: 16px;
      margin: 28px 0 4px;
      border-top: 1px solid #ddd;
      padding-top: 16px;
    }
    section:first-of-type h2 {
      border-top: none;
      padding-top: 0;
    }
    .club-summary {
      font-size: 12px;
      color: #555;
      margin-bottom: 10px;
    }
    details.member {
      border: 1px solid #e2e2e2;
      border-radius: 4px;
      margin-bottom: 6px;
      padding: 6px 10px;
    }
    details.member summary {
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .member-name {
      font-weight: 600;
    }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .badge-both { background: #dff3e3; color: #1e7a34; }
    .badge-basecamp-only { background: #ffe8d6; color: #a65500; }
    .badge-easyspeak-only { background: #e0ecff; color: #1a4fa0; }
    .badge-exact { background: #dff3e3; color: #1e7a34; }
    .badge-fuzzy { background: #fff2cc; color: #9a7a00; }
    .no-active-path {
      font-size: 11px;
      color: #888;
      font-style: italic;
      margin: 4px 0;
    }
    .path-block {
      margin: 10px 0;
    }
    .path-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .path-presence {
      font-weight: 400;
      color: #777;
      text-transform: none;
      letter-spacing: normal;
    }
    .non-pathway-note {
      font-size: 12px;
      color: #777;
      font-style: italic;
    }
    table.levels {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    table.levels th, table.levels td {
      text-align: left;
      padding: 3px 6px;
      border-bottom: 1px solid #eee;
    }
    table.levels tr.pending {
      background: #fff2cc;
    }
    table.levels tr.discrepancy {
      background: #ffe4e4;
    }
    table.levels tr.completion-row {
      font-style: italic;
      color: #666;
    }
    .empty-state {
      font-size: 14px;
      color: #555;
      margin-top: 40px;
    }
    #downloadCsvBtn {
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      background: #772432;
      color: white;
      border: none;
      border-radius: 4px;
      margin-bottom: 16px;
    }
    #downloadCsvBtn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>Comparison Report</h1>
  <div class="meta" id="reportMeta"></div>
  <button id="downloadCsvBtn">Download CSV</button>
  <div id="reportRoot"></div>

  <script src="../lib/report.js"></script>
  <script src="report.js"></script>
</body>
</html>
