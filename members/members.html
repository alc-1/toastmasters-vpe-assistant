<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Toastmasters VPE Tracker — Member Matching</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 20px 60px;
      color: #222;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 4px;
    }
    .meta {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }
    .nav-links {
      font-size: 12px;
      margin-bottom: 20px;
    }
    .nav-links a {
      color: #772432;
    }
    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid #ddd;
      margin-bottom: 12px;
    }
    .tab-btn {
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: #666;
    }
    .tab-btn:hover {
      color: #222;
    }
    .tab-btn.active {
      color: #772432;
      font-weight: 600;
      border-bottom-color: #772432;
    }
    .filter-chips {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .chip {
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      background: #f0f0f0;
      border: 1px solid #ddd;
      border-radius: 14px;
      color: #444;
    }
    .chip:hover {
      background: #e6e6e6;
    }
    .chip.active {
      background: #772432;
      border-color: #772432;
      color: white;
    }
    .club-summary {
      font-size: 12px;
      color: #555;
      margin-bottom: 10px;
    }
    table.members {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-bottom: 20px;
    }
    table.members th, table.members td {
      text-align: left;
      padding: 6px 8px;
      border-bottom: 1px solid #eee;
      vertical-align: top;
    }
    table.members th {
      background: #fafafa;
    }
    table.members tr.muted-row {
      color: #888;
      font-style: italic;
    }
    table.members tr.detail-row {
      background: #fafafa;
    }
    table.members tr.detail-row.collapsed {
      display: none;
    }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .badge-both { background: #dff3e3; color: #1e7a34; }
    .badge-exact { background: #dff3e3; color: #1e7a34; }
    .badge-confirmed { background: #dbe9ff; color: #1a4fa0; }
    .badge-fuzzy { background: #fff2cc; color: #9a7a00; }
    .badge-unmatched { background: #ffe8d6; color: #a65500; }
    .badge-path-issue { background: #ffe4e4; color: #a01414; }
    .muted-text {
      color: #999;
    }
    .actions {
      white-space: nowrap;
    }
    .actions button {
      font-size: 11px;
      padding: 4px 8px;
      margin-right: 4px;
      cursor: pointer;
      background: #772432;
      color: white;
      border: none;
      border-radius: 4px;
    }
    .actions button.secondary {
      background: #eee;
      color: #444;
    }
    .actions button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
    input.link-search {
      font-size: 12px;
      padding: 3px 6px;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 3px;
    }
    .path-pair-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 6px 0;
      font-size: 12px;
    }
    .path-pair-row select {
      font-size: 12px;
      padding: 2px;
    }
    .empty-state {
      font-size: 14px;
      color: #555;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <h1>Member Matching</h1>
  <div class="meta" id="pageMeta"></div>
  <div class="nav-links">
    <a href="../report/report.html">Comparison report</a> · <a href="../settings/settings.html">Settings (lookups)</a>
  </div>

  <div id="clubTabs" class="tabs"></div>
  <div id="filterChips" class="filter-chips"></div>
  <div id="membersRoot"></div>

  <script src="../lib/dom-utils.js"></script>
  <script src="../lib/report.js"></script>
  <script src="../lib/resolution-store.js"></script>
  <script src="members.js"></script>
</body>
</html>
