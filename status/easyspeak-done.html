<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Toastmasters VPE Tracker — EasySpeak data fetched</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 520px;
      margin: 80px auto 0;
      padding: 0 20px;
      color: #222;
      text-align: center;
    }
    .icon {
      font-size: 40px;
      line-height: 1;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 12px;
      color: #1e7a34;
    }
    p {
      font-size: 13px;
      color: #555;
      line-height: 1.5;
    }
    .note {
      font-size: 12px;
      color: #777;
      margin-top: 24px;
    }
    button {
      font-size: 12px;
      padding: 5px 10px;
      cursor: pointer;
      background: #eee;
      color: #444;
      border: none;
      border-radius: 4px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="icon">✅</div>
  <h1>EasySpeak data fetched</h1>
  <p>
    All club data has been extracted and saved. Open the extension popup to
    see the results.
  </p>
  <p class="note" id="countdownText">This tab will close automatically in <span id="countdown">5</span> seconds.</p>
  <button id="cancelBtn">Keep this tab open</button>

  <script src="countdown.js"></script>
</body>
</html>
